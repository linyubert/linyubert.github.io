<script>
// ===== 上課鎖：要鎖的作品編號（改這裡即可增減）=====
const DatoLock=(()=>{
  const LOCKED=new Set(['001','007','008','013','017','020','022','023']);
  const bd=document.getElementById('lockBd'),form=document.getElementById('lockForm'),inp=document.getElementById('lockInput'),err=document.getElementById('lockErr');
  let pendingUrl=null, pendingCode=null;
  const isOpen=()=>bd.classList.contains('on');
  function ask(url, code){
    pendingUrl=url; pendingCode=code;
    inp.value=''; err.textContent='';
    bd.classList.add('on'); bd.setAttribute('aria-hidden','false');
    setTimeout(()=>inp.focus(),60);
  }
  function close(){bd.classList.remove('on');bd.setAttribute('aria-hidden','true');pendingUrl=null;pendingCode=null;}
  form.addEventListener('submit',e=>{
    e.preventDefault();
    const c2 = String(pendingCode||'').padStart(2,'0').slice(-2);
    const expected = 'dato2026' + c2;
    if(inp.value.trim() === expected){
      const u = pendingUrl; close();
      if(u) window.open(u,'_blank','noopener');
    }else{
      err.textContent='密碼不對喔，再試一次！'; inp.select();
      form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
    }
  });
  document.getElementById('lockNo').onclick=close;
  bd.addEventListener('click',e=>{if(e.target===bd)close()});
  addEventListener('keydown',e=>{if(isOpen()&&e.key==='Escape'){e.stopImmediatePropagation();close()}},true);
  ['pointerdown','wheel'].forEach(t=>bd.addEventListener(t,e=>e.stopPropagation()));
  return {has:c=>LOCKED.has(c),isLocked:c=>LOCKED.has(c),ask,isOpen};
})();

    "short": "音符氣球大亂鬥",
    "en": "Note Shot",
    "title": "音符氣球大亂鬥 Note Shot",
    "kind": "SIGHT READING / VERSUS",
    "url": "https://datomusiclab.dpdns.org/noteshot/",
    "img": "assets/thumbs/024-noteshot.jpg",
    "desc": "誰是視譜神手？看五線譜音符，比快也比準射破對應唱名氣球！支援單人手感暖身與雙人同機刺激競速，可自由切換英、中、注音三種唱名顯示與自訂音域難度，看誰先達標獲勝！",
    "mode": "鍵盤雙人對戰（P1: A S D F / P2: J K L ;）或滑鼠、觸控點擊氣球",
    "tags": ["五線譜視譜", "雙人競速", "唱名注音轉換"]
  }
];
(()=>{
const N=DATA.length,deck=document.getElementById('deck'),stage=document.getElementById('stage');
document.getElementById('total').textContent=`Complete Catalogue / ${N} Projects`;
const modal={
  bd:document.getElementById('modalBackdrop'),
  close:document.getElementById('modalClose'),
  img:document.getElementById('mImg'),
  ck:document.getElementById('mCodeKind'),
  title:document.getElementById('mTitle'),
  en:document.getElementById('mEn'),
  desc:document.getElementById('mDesc'),
  mode:document.getElementById('mMode'),
  tags:document.getElementById('mTags'),
  play:document.getElementById('mPlay'),
  lesson:document.getElementById('mLesson')
};
let modalOpen=false;
function openModal(p){
  modal.img.src=p.img;
  modal.img.alt=p.short;
  modal.ck.innerHTML=`${p.code} / ${String(N).padStart(3,'0')} &nbsp;<span>·&nbsp; ${p.kind}</span>`;
  modal.title.textContent=p.short;
  modal.en.textContent=p.en;
  modal.desc.textContent=p.desc;
  modal.mode.textContent=p.mode;
  modal.tags.innerHTML=p.tags.map(t=>`<span class="modal-tag">${t}</span>`).join('');
  modal.play.dataset.code=p.code;modal.play.dataset.url=p.url;
  setPlayBtn();
  modal.lesson.href=p.lesson||`lesson.html?code=${p.code}`;
  modal.bd.classList.add('on');
  modal.bd.setAttribute('aria-hidden','false');
  modalOpen=true;
}
const PLAY_ICON='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const LOCK_ICON='<span class="lock-ico"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>';
function setPlayBtn(){
  const c=modal.play.dataset.code,locked=DatoLock.isLocked(c);
  modal.play.classList.toggle('locked',locked);
  modal.play.href=locked?'#':modal.play.dataset.url;
  modal.play.innerHTML=locked?`${LOCK_ICON}<span>上課解鎖</span>`:`${PLAY_ICON}<span>前往遊戲</span>`;
}
modal.play.addEventListener('click',e=>{const c=modal.play.dataset.code;if(DatoLock.isLocked(c)){e.preventDefault();DatoLock.ask(modal.play.dataset.url, c)}});
document.addEventListener('dato-unlock',()=>{if(modal.play.dataset.code)setPlayBtn()});
function closeModal(){
  modal.bd.classList.remove('on');
  modal.bd.setAttribute('aria-hidden','true');
  modalOpen=false;
}
modal.close.onclick=closeModal;
modal.bd.addEventListener('click',e=>{if(e.target===modal.bd)closeModal()});
const cards=DATA.map((p,i)=>{
  const a=document.createElement('div');
  a.className='card';a.setAttribute('role','button');a.tabIndex=0;
  const img=new Image();img.src=p.img;img.alt=p.short;img.draggable=false;
  a.appendChild(img);
  a.insertAdjacentHTML('beforeend',`<span class="code">${p.code}</span><span class="name">${p.short}</span>${DatoLock.has(p.code)?LOCK_ICON:''}`);
  a.addEventListener('click',e=>{if(suppress){e.preventDefault();return}if(i!==front){goTo(i)}else{openModal(p)}});
  deck.appendChild(a);return a;
});
const rows=document.getElementById('rows');
DATA.forEach(p=>{const r=document.createElement('button');r.type='button';r.className='row';
  r.innerHTML=`<span class="micro">${p.code}${DatoLock.has(p.code)?LOCK_ICON:''}</span><b>${p.title}</b><span class="micro k" style="letter-spacing:0.08em;font-size:9px;opacity:0.65;">${p.kind}</span><span style="font-size:14px;">＋</span>`;
  r.onclick=()=>openModal(p);
  rows.appendChild(r)});
const idx=document.getElementById('index'),btn=document.getElementById('indexBtn');
btn.onclick=()=>{const on=idx.classList.toggle('on');document.body.classList.toggle('index-on',on);btn.textContent=on?'Close':'Index';btn.classList.toggle('close-index',on)};
let pos=0,target=0,front=-1,drag=false,moved=false,suppress=false,sx=0,sp=0;
const mod=(a,n)=>((a%n)+n)%n;
const shortest=d=>mod(d+N/2,N)-N/2;
function goTo(i){target=Math.round(pos)+shortest(i-pos)}
document.getElementById('prev').onclick=()=>{target=Math.round(target)-1};
document.getElementById('next').onclick=()=>{target=Math.round(target)+1};
addEventListener('keydown',e=>{
  if(e.key==='Escape'&&modalOpen){closeModal();return}
  if(modalOpen)return;
  if(e.key==='ArrowLeft')target=Math.round(target)-1;
  if(e.key==='ArrowRight')target=Math.round(target)+1;
  if(e.key==='Enter'&&front>=0)openModal(DATA[front]);
});
stage.addEventListener('wheel',e=>{if(modalOpen)return;e.preventDefault();target+=(e.deltaY+e.deltaX)*.0025},{passive:false});
stage.addEventListener('pointerdown',e=>{if(modalOpen||e.target.closest('button,.open,.badge'))return;drag=true;moved=false;sx=e.clientX;sp=target;stage.classList.add('drag');stage.setPointerCapture(e.pointerId)});
stage.addEventListener('pointermove',e=>{if(!drag)return;const d=e.clientX-sx;if(Math.abs(d)>6)moved=true;target=sp-d/(innerWidth<760 ? 110 : 170)});
const end=()=>{if(!drag)return;drag=false;stage.classList.remove('drag');suppress=moved;target=Math.round(target);setTimeout(()=>suppress=false,0)};
stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);
stage.addEventListener('dragstart',e=>e.preventDefault());
const info={c:document.getElementById('iCode'),k:document.getElementById('iKind'),t:document.getElementById('iTitle'),o:document.getElementById('iOpen')};
info.o.onclick=()=>{if(front>=0)openModal(DATA[front])};
function frame(){
  pos+=(target-pos)*0.12;
  const W=innerWidth,H=innerHeight,mobile=W<760;
  const step=mobile ? 15 : 12, R=mobile ? 900 : Math.max(1000, W * 0.78);
  const cx = W / 2;
  const cy = H * (mobile ? 0.74 : 0.78) + R;
  let best=0,bd=1e9;
  cards.forEach((c,i)=>{
    const d=shortest(i-pos),ad=Math.abs(d);
    if(ad<bd){bd=ad;best=mod(i,N)}
    const ang=d*step,rad=ang*Math.PI/180;
    const x=Math.sin(rad)*R,y=cy-Math.cos(rad)*R;
    const lift=Math.max(0,1-ad)*(mobile ? 14 : 26);
    const s=1+Math.max(0,1-ad)*0.14;
    c.style.transform=`translate(${x}px,${y-lift}px) translate(-50%,-50%) rotate(${ang}deg) scale(${s})`;
    c.style.zIndex=String(100-Math.round(ad*10));
    const vis=ad<=(mobile ? 2.6 : 4.2);
    c.style.opacity=vis ? 1 : 0;
    c.style.pointerEvents=vis ? 'auto' : 'none';
  });
  if(best!==front){front=best;cards.forEach((c,i)=>c.classList.toggle('front',i===front));
    const p=DATA[front];info.c.textContent=`${p.code} / ${String(N).padStart(3,'0')}`;info.k.textContent=p.kind;info.t.innerHTML=`<span>${p.short}</span><span class="title-en" style="font-size:0.56em;color:#60646c;display:block;margin-top:4px;margin-left:0;font-weight:400;letter-spacing:0.04em;">${p.en}</span>`}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
