<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dato Playground — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#dcdcdc;--ink:#111;--red:#e24b3b;--sans:"Archivo","Noto Sans TC",sans-serif;--ch:clamp(150px,25vh,250px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);overscroll-behavior:none}
a{color:inherit;text-decoration:none}
.stage{position:relative;height:100vh;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.stage.drag{cursor:grabbing}
.micro{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;line-height:1.3}
.plus{position:absolute;font-size:14px;font-weight:500;line-height:1;opacity:.55;pointer-events:none}
.tri{position:absolute;width:0;height:0;border:5px solid transparent;pointer-events:none}
.top-l{position:absolute;left:5vw;top:5vh}
.top-l b{display:block;font-weight:900;font-size:clamp(14px,1.5vw,20px);letter-spacing:.02em;line-height:1}
.badge{position:absolute;right:5vw;top:5vh;width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center}
.badge::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink);transition:background .2s}
.badge{z-index:6;cursor:pointer;transition:border-color .2s}.badge:hover{border-color:var(--red)}.badge:hover::after{background:var(--red)}
.red-bar{position:absolute;left:50%;top:5vh;width:clamp(70px,11vw,150px);height:33vh;margin-left:calc(clamp(70px,11vw,150px)/-2);background:var(--red)}
.title{position:absolute;left:0;right:0;top:15vh;margin:0;text-align:center;pointer-events:none;font-weight:900;font-size:clamp(44px,9.4vw,150px);letter-spacing:-.045em;line-height:.9}
.title span{display:block;position:relative;white-space:nowrap}
.title .ghost{position:absolute;left:0;right:0;top:0;color:transparent;-webkit-text-stroke:1.2px var(--ink);transform:translate(-2%,-22%) scaleY(.7) skewX(-6deg);opacity:.8}
.title .ghost.b{transform:translate(2.2%,26%) scaleY(.42) skewX(8deg);opacity:.6}
.sub-l,.sub-r{position:absolute;top:calc(15vh + clamp(60px,11vw,170px) + 7vh)}
.sub-l{left:5vw}.sub-r{right:5vw;text-align:right}
.deck{position:absolute;inset:0;pointer-events:none}
.card{position:absolute;left:50%;top:0;height:var(--ch);width:calc(var(--ch)*1.5);border-radius:14px;overflow:hidden;background:#222;color:#fff;pointer-events:auto;will-change:transform;box-shadow:0 22px 50px rgba(0,0,0,.28);-webkit-user-drag:none}
.card img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;-webkit-user-drag:none}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 26%,transparent 60%,rgba(0,0,0,.75));pointer-events:none}
.card .code{position:absolute;z-index:2;left:12px;top:10px;font-size:9px;font-weight:700;letter-spacing:.14em}
.card .name{position:absolute;z-index:2;left:12px;right:12px;bottom:11px;font-weight:900;font-size:clamp(14px,1.4vw,20px);line-height:1.1}
.card.front{box-shadow:0 30px 70px rgba(0,0,0,.4)}
.ring{position:absolute;left:50%;bottom:-24vh;width:min(58vw,640px);aspect-ratio:1;margin-left:calc(min(58vw,640px)/-2);border:1.5px dashed rgba(17,17,17,.45);border-radius:50%;pointer-events:none}
.info{position:absolute;left:5vw;top:46vh;max-width:min(300px,30vw);z-index:200}
.info .n{color:var(--red)}
.info h2{margin:8px 0 6px;font-weight:900;font-size:clamp(20px,2.4vw,34px);line-height:1.05;letter-spacing:-.02em}
.open{display:inline-block;margin-top:12px;padding:10px 16px;border-radius:999px;background:var(--ink);color:#fff;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;transition:background .2s}
.open:hover{background:var(--red)}
.nav{position:absolute;right:5vw;top:46vh;display:flex;gap:10px;z-index:200}
.nav button,.mode{font:inherit;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;transition:background .2s,color .2s}
.nav button{width:46px;height:46px;border-radius:50%;font-size:17px;font-weight:700}
.nav button:hover,.mode:hover{background:var(--ink);color:var(--bg)}
.mode{position:absolute;z-index:6;right:calc(5vw + 34px + 12px);top:calc(5vh + 17px);transform:translateY(-50%);padding:8px 14px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.index{display:none;position:fixed;inset:0;z-index:300;background:var(--bg);overflow:auto;padding:14vh 5vw 6vh}
.index.on{display:block}
.index h3{margin:0 0 22px;font-weight:900;font-size:clamp(34px,6vw,90px);letter-spacing:-.04em;line-height:.9}
.rows{border-top:2px solid var(--ink)}
.row{display:grid;grid-template-columns:70px 1fr auto 40px;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid rgba(17,17,17,.3);transition:background .15s,color .15s,padding .15s}
.row:hover{background:var(--ink);color:var(--bg);padding-left:14px}
.row b{font-weight:900;font-size:clamp(16px,2vw,26px)}
.row .micro{opacity:.7}
.mode.close-index{z-index:400}
body.index-on .deck,body.index-on .info,body.index-on .nav,body.index-on .ring,body.index-on .title,body.index-on .red-bar,body.index-on .sub-l,body.index-on .sub-r{visibility:hidden}
body.index-on .back{z-index:400}
.back{position:fixed;left:5vw;bottom:2vh;z-index:40;font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.6}
@media(max-width:760px){:root{--ch:clamp(120px,19vh,170px)}.info{max-width:56vw;top:44vh}.sub-l,.sub-r{display:none}.mode{transform:none;right:5vw;top:calc(5vh + 46px)}.row{grid-template-columns:44px 1fr 30px}.row .k{display:none}}
</style>
</head>
<body>
<main class="stage" id="stage">
  <span class="plus" style="left:2.2vw;top:3vh">+</span><span class="plus" style="left:50%;top:3vh">+</span><span class="plus" style="right:2.2vw;top:3vh">+</span>
  <span class="plus" style="left:2.2vw;top:44vh">+</span><span class="plus" style="right:2.2vw;top:44vh">+</span>
  <span class="tri" style="left:1.4vw;top:23vh;border-left-color:#111;border-left-width:8px"></span><span class="tri" style="right:1.4vw;top:23vh;border-right-color:#111;border-right-width:8px"></span>
  <div class="top-l"><b>WELCOME<br>TO MY</b></div>
  <a class="badge" href="http://datomusiclab.dpdns.org" aria-label="回到 Dato Music Lab 首頁" title="Dato Music Lab"></a>
  <div class="red-bar"></div>
  <h1 class="title" aria-label="Playground"><span class="ghost">PLAYGROUND</span><span class="ghost b">PLAYGROUND</span><span>PLAYGROUND</span></h1>
  <div class="sub-l micro">Dato Music Lab<br>Music Teacher</div>
  <div class="sub-r micro" id="total"></div>
  <button class="mode" id="indexBtn" type="button">Index</button>
  <div class="ring"></div>
  <div class="deck" id="deck"></div>
  <div class="info"><div class="micro"><span class="n" id="iCode"></span> &nbsp;/&nbsp; <span id="iKind"></span></div><h2 id="iTitle"></h2><a class="open" id="iOpen" target="_blank" rel="noopener" href="#">Open project ↗</a></div>
  <div class="nav"><button id="prev" type="button" aria-label="Previous">←</button><button id="next" type="button" aria-label="Next">→</button></div>
</main>
<section class="index" id="index"><h3>CATALOGUE</h3><div class="rows" id="rows"></div></section>
<a class="back" href="index.html#playground">← Dato Music Lab</a>
<script>
const DATA=[{"url": "https://datomusiclab.dpdns.org/goldenyes/", "code": "001", "kind": "Soundscape / Featured", "title": "聽見永順｜聲景島大冒險", "img": "assets/golden-record-preview.png", "short": "聽見永順"}, {"url": "https://linyubert.github.io/recorderplane/", "code": "002", "kind": "Recorder / Featured", "title": "直笛動力飛行任務", "img": "assets/thumb-recorderplane.jpg", "short": "直笛動力飛行"}, {"url": "https://linyubert.github.io/music-tug-of-war/", "code": "003", "kind": "Sight Reading / Featured", "title": "五線譜拔河賽", "img": "assets/dato-classroom-rhythm.jpg", "short": "五線譜拔河賽"}, {"url": "https://linyubert.github.io/rhythm-ocean/", "code": "004", "kind": "Rhythm / Playable", "title": "節奏海洋 Rhythm Ocean", "img": "assets/thumb-rhythmocean.jpg", "short": "節奏海洋"}, {"url": "https://linyubert.github.io/Wind-Blade/", "code": "005", "kind": "Recorder / Playable", "title": "直笛水果忍者", "img": "assets/thumb-windblade.jpg", "short": "直笛水果忍者"}, {"url": "https://linyubert.github.io/espionage-telegraph/", "code": "006", "kind": "Ear Training / Playable", "title": "諜報電報", "img": "assets/thumb-telegraph.jpg", "short": "諜報電報"}, {"url": "https://linyubert.github.io/catchuper/", "code": "007", "kind": "Rhythm / Playable", "title": "番茄醬節奏大師", "img": "assets/thumb-catchuper.jpg", "short": "番茄醬節奏大師"}, {"url": "https://datomusiclab.dpdns.org/dadabeard/", "code": "008", "kind": "Imitation / Playable", "title": "節奏幫爸爸拔鬍子", "img": "assets/thumb-dadabeard.jpg", "short": "幫爸爸拔鬍子"}, {"url": "https://linyubert.github.io/timesmath/", "code": "009", "kind": "Motion / Playable", "title": "倍數守門員", "img": "assets/thumb-timesmath.jpg", "short": "倍數守門員"}, {"url": "https://linyubert.github.io/music3grade/", "code": "010", "kind": "RPG Quiz / Playable", "title": "三年級音樂大進擊", "img": "assets/thumb-music3grade.jpg", "short": "音樂大進擊"}, {"url": "https://linyubert.github.io/xmasmission/", "code": "011", "kind": "Seasonal / Playable", "title": "魔法聖誕樹", "img": "assets/thumb-xmasmission.jpg", "short": "魔法聖誕樹"}, {"url": "https://linyubert.github.io/sound-sampler/", "code": "012", "kind": "Sound Tool / Open", "title": "聲音採樣機", "img": "assets/dato-instrument-collage.png", "short": "聲音採樣機"}, {"url": "https://datomusiclab.dpdns.org/picthmission/", "code": "013", "kind": "Pitch / Ear Training", "title": "走音偵探 Pitch Detective", "img": "assets/thumb-pitch-detective.jpg", "short": "走音偵探"}, {"url": "https://datomusiclab.dpdns.org/aorbins/", "code": "014", "kind": "Listening / Instrument ID", "title": "什麼樂器在唱歌？", "img": "assets/thumb-aorbins.jpg", "short": "聽聲音・找樂器"}, {"url": "https://linyubert.github.io/downstairasun/", "code": "015", "kind": "Motion / Recorder", "title": "阿順下樓梯 Stair Rush", "img": "assets/thumb-downstairasun.jpg", "short": "阿順下樓梯"}, {"url": "https://linyubert.github.io/SONORA/", "code": "016", "kind": "Listening / Sound Bells", "title": "SONORA 蒙特梭利音感鐘", "img": "assets/thumb-SONORA.jpg", "short": "SONORA 音感鐘"}, {"url": "https://linyubert.github.io/beattrain/", "code": "017", "kind": "Rhythm / Playable", "title": "節奏列車 Rhythm Train", "img": "assets/thumb-beattrain.jpg", "short": "節奏列車"}, {"url": "https://linyubert.github.io/fpbird/", "code": "018", "kind": "Dynamics / Playable", "title": "力度彈弓 音樂山雀", "img": "assets/thumb-fpbird.jpg", "short": "力度彈弓"}, {"url": "https://linyubert.github.io/notejenga/", "code": "019", "kind": "Sight Reading / Playable", "title": "音符磚塊疊疊樂", "img": "assets/thumb-notejenga.jpg", "short": "音符疊疊樂"}];
(()=>{
const N=DATA.length,deck=document.getElementById('deck'),stage=document.getElementById('stage');
document.getElementById('total').textContent=`Complete Catalogue / ${N} Projects`;
const cards=DATA.map((p,i)=>{
  const a=document.createElement('a');
  a.className='card';a.href=p.url;a.target='_blank';a.rel='noopener';
  const img=new Image();img.src=p.img;img.alt=p.short;img.draggable=false;
  img.onload=()=>{a.style.width=`calc(var(--ch)*${(img.naturalWidth/img.naturalHeight).toFixed(4)})`};
  a.appendChild(img);
  a.insertAdjacentHTML('beforeend',`<span class="code">${p.code}</span><span class="name">${p.short}</span>`);
  a.addEventListener('click',e=>{if(suppress){e.preventDefault();return}if(i!==front){e.preventDefault();goTo(i)}});
  deck.appendChild(a);return a;
});
const rows=document.getElementById('rows');
DATA.forEach(p=>{const r=document.createElement('a');r.className='row';r.href=p.url;r.target='_blank';r.rel='noopener';
  r.innerHTML=`<span class="micro">${p.code}</span><b>${p.title}</b><span class="micro k">${p.kind}</span><span>↗</span>`;rows.appendChild(r)});
const idx=document.getElementById('index'),btn=document.getElementById('indexBtn');
btn.onclick=()=>{const on=idx.classList.toggle('on');document.body.classList.toggle('index-on',on);btn.textContent=on?'Close':'Index';btn.classList.toggle('close-index',on)};
let pos=0,target=0,front=-1,drag=false,moved=false,suppress=false,sx=0,sp=0;
const mod=(a,n)=>((a%n)+n)%n;
const shortest=d=>mod(d+N/2,N)-N/2;
function goTo(i){target=Math.round(pos)+shortest(i-pos)}
document.getElementById('prev').onclick=()=>{target=Math.round(target)-1};
document.getElementById('next').onclick=()=>{target=Math.round(target)+1};
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')target=Math.round(target)-1;if(e.key==='ArrowRight')target=Math.round(target)+1});
stage.addEventListener('wheel',e=>{e.preventDefault();target+=(e.deltaY+e.deltaX)*.0025},{passive:false});
stage.addEventListener('pointerdown',e=>{if(e.target.closest('button,.open,.badge'))return;drag=true;moved=false;sx=e.clientX;sp=target;stage.classList.add('drag');stage.setPointerCapture(e.pointerId)});
stage.addEventListener('pointermove',e=>{if(!drag)return;const d=e.clientX-sx;if(Math.abs(d)>6)moved=true;target=sp-d/(innerWidth<760?110:170)});
const end=()=>{if(!drag)return;drag=false;stage.classList.remove('drag');suppress=moved;target=Math.round(target);setTimeout(()=>suppress=false,0)};
stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);
stage.addEventListener('dragstart',e=>e.preventDefault());
const info={c:document.getElementById('iCode'),k:document.getElementById('iKind'),t:document.getElementById('iTitle'),o:document.getElementById('iOpen')};
function frame(){
  pos+=(target-pos)*.12;
  const W=innerWidth,H=innerHeight,mobile=W<760;
  const step=mobile?15:12,R=mobile?900:Math.max(1000,W*.78);
  const cx=W/2,cy=H*(mobile?.74:.78)+R;
  let best=0,bd=1e9;
  cards.forEach((c,i)=>{
    const d=shortest(i-pos),ad=Math.abs(d);
    if(ad<bd){bd=ad;best=mod(i,N)}
    const ang=d*step,rad=ang*Math.PI/180;
    const x=Math.sin(rad)*R,y=cy-Math.cos(rad)*R;
    const lift=Math.max(0,1-ad)*(mobile?14:26);
    const s=1+Math.max(0,1-ad)*.14;
    c.style.transform=`translate(${x}px,${y-lift}px) translate(-50%,-50%) rotate(${ang}deg) scale(${s})`;
    c.style.zIndex=String(100-Math.round(ad*10));
    const vis=ad<=(mobile?2.6:4.2);
    c.style.opacity=vis?1:0;c.style.pointerEvents=vis?'auto':'none';
  });
  if(best!==front){front=best;cards.forEach((c,i)=>c.classList.toggle('front',i===front));
    const p=DATA[front];info.c.textContent=`${p.code} / ${String(N).padStart(3,'0')}`;info.k.textContent=p.kind;info.t.textContent=p.title;info.o.href=p.url}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
