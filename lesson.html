:root{--bg:#dcdcdc;--ink:#111;--red:#e24b3b;--sans:"Archivo","Noto Sans TC",sans-serif}

a{color:inherit;text-decoration:none}

.micro{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
h1{margin:8px 0 6px;font-weight:900;font-size:clamp(28px,4.5vw,52px);letter-spacing:-.03em;line-height:1.1}
.sub{font-size:16px;color:#555;margin:0 0 28px}
.hero{width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#222;margin-bottom:36px;box-shadow:0 20px 50px rgba(0,0,0,.18)}

.stat{background:#e9e9e9;border:1.5px solid rgba(17,17,17,.15);border-radius:12px;padding:16px 20px}

/* ===== 上課鎖 Lock ===== */
.lock-bd{position:fixed;inset:0;z-index:900;background:rgba(10,10,10,.6);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:5vw;opacity:0;pointer-events:none;transition:opacity .2s}
.lock-bd.on{opacity:1;pointer-events:auto}
.lock-card{width:min(400px,100%);background:#161616;color:#fff;border-radius:18px;padding:30px 28px 24px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.08);font-family:"Archivo","Noto Sans TC",sans-serif;transform:translateY(8px);transition:transform .2s}
.lock-bd.on .lock-card{transform:none}
.lock-card .lock-ring{width:56px;height:56px;margin:0 auto 16px;border-radius:50%;background:#e24b3b;display:grid;place-items:center}
.lock-card .lock-ring svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.lock-card h3{margin:0 0 6px;font-size:20px;font-weight:900;line-height:1.35;letter-spacing:.01em}
.lock-card p{margin:0 0 18px;font-size:12.5px;color:rgba(255,255,255,.55);letter-spacing:.04em}
.lock-card input{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;font:inherit;font-size:15px;text-align:center;letter-spacing:.12em;outline:none;transition:border-color .2s}
.lock-card input:focus{border-color:#e24b3b}
.lock-err{min-height:18px;margin:8px 0 4px;font-size:12px;color:#ff8a7a}
.lock-btns{display:flex;gap:10px;margin-top:6px}
.lock-btns button{flex:1;padding:12px;border-radius:10px;border:0;font:inherit;font-size:13px;font-weight:800;letter-spacing:.08em;cursor:pointer;transition:background .2s,color .2s}
.lock-btns .lock-ok{background:#fff;color:#111}.lock-btns .lock-ok:hover{background:#e24b3b;color:#fff}
.lock-btns .lock-no{background:rgba(255,255,255,.1);color:#fff}.lock-btns .lock-no:hover{background:rgba(255,255,255,.2)}
.lock-card.shake{animation:lockShake .35s}

.lock-ico{display:inline-grid;place-items:center}
.lock-ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
body.dato-unlocked .lock-ico{display:none!important}
.play.locked{background:#e24b3b}.play.locked:hover{background:var(--ink)}

<script>
// ===== 上課鎖：要鎖的作品編號（改這裡即可增減）=====
const DatoLock=(()=>{
  const LOCKED=new Set(['001','007','008','013','017','020']);
  const HASH='15f0ac7d',KEY='dato-unlocked';
  const fnv=s=>{let h=0x811c9dc5;for(const b of new TextEncoder().encode(s)){h=Math.imul(h^b,0x01000193)>>>0}return h.toString(16).padStart(8,'0')};
  const ok=()=>{try{return sessionStorage.getItem(KEY)==='1'}catch(e){return false}};
  const bd=document.getElementById('lockBd'),form=document.getElementById('lockForm'),inp=document.getElementById('lockInput'),err=document.getElementById('lockErr');
  let pending=null;
  const isOpen=()=>bd.classList.contains('on');
  function ask(url){pending=url;inp.value='';err.textContent='';bd.classList.add('on');bd.setAttribute('aria-hidden','false');setTimeout(()=>inp.focus(),60)}
  function close(){bd.classList.remove('on');bd.setAttribute('aria-hidden','true');pending=null}
  function markUnlocked(){document.body.classList.add('dato-unlocked');document.dispatchEvent(new Event('dato-unlock'))}
  form.addEventListener('submit',e=>{
    e.preventDefault();
    if(fnv(inp.value.trim())===HASH){
      try{sessionStorage.setItem(KEY,'1')}catch(_){}
      const u=pending;close();markUnlocked();
      if(u)window.open(u,'_blank','noopener');
    }else{
      err.textContent='密碼不對喔，再試一次！';inp.select();
      form.classList.remove('shake');void form.offsetWidth;form.classList.add('shake');
    }
  });
  document.getElementById('lockNo').onclick=close;
  bd.addEventListener('click',e=>{if(e.target===bd)close()});
  addEventListener('keydown',e=>{if(isOpen()&&e.key==='Escape'){e.stopImmediatePropagation();close()}},true);
  ['pointerdown','wheel'].forEach(t=>bd.addEventListener(t,e=>e.stopPropagation()));
  if(ok())document.body.classList.add('dato-unlocked');
  return {has:c=>LOCKED.has(c),isLocked:c=>LOCKED.has(c)&&!ok(),ask,isOpen};
})();
